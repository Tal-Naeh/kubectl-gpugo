# Triggered when a v* tag is pushed. Cross-compiles via GoReleaser and
# publishes a GitHub Release with archives + checksums attached. The
# resulting download URLs are what krew-index will reference.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # GoReleaser uses git history for changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-PR to krew-index with the new sha256s + URIs. Triggers off the
      # GitHub Release that GoReleaser just produced. Krew's tide bot auto-
      # approves these update PRs. Recommended by ahmetb on the v0.1.1 PR.
      - name: Update plugin manifest on krew-index
        uses: rajatjindal/krew-release-bot@v0.0.46
